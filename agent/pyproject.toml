[project]
name = "threshold"
version = "0.1.0"
description = "Agentic inpatient coding pipeline with evidence-cited outputs and confidence routing (demo)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic]>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
