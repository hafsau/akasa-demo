# Live mode (not deployed yet). From the repo root:
#   fly launch --config agent/fly.toml --dockerfile agent/Dockerfile --no-deploy
#   fly secrets set ANTHROPIC_API_KEY=... ANTHROPIC_WORKSPACE_ID=... --config agent/fly.toml
#   fly deploy --config agent/fly.toml --dockerfile agent/Dockerfile
app = "threshold-agent"
primary_region = "sjc"

[env]
  LIVE_CASES = "enc-01,enc-02,enc-04"
  LIVE_PER_IP = "3"
  LIVE_DAILY = "60"
  ALLOWED_ORIGINS = "https://akasa-demo.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
